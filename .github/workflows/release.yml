name: Build and release Executa

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
  UV_PYTHON_DOWNLOADS: never
  UV_TOOL_DIR: ${{ github.workspace }}/.cache/uv-tools
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.cache/uv-bin

jobs:
  verify-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:python
      - run: pnpm sync:python
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm test

  build-executa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            binary: mini-notes-summarizer
          - os: macos-15-intel
            platform: darwin-x86_64
            binary: mini-notes-summarizer
          - os: windows-latest
            platform: windows-x86_64
            binary: mini-notes-summarizer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Resolve release version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $RAW_VERSION" >&2
            exit 1
          fi
          echo "EXECUTA_VERSION=$version" >> "$GITHUB_ENV"
      - run: uv venv .venv --python 3.12 --no-python-downloads
      - run: uv sync --no-python-downloads
      - name: Build and smoke-test binary
        shell: bash
        run: |
          uv run python scripts/build_binary.py \
            --platform "${{ matrix.platform }}" \
            --version "$EXECUTA_VERSION"
      - name: Smoke test JSON-RPC
        shell: bash
        run: |
          uv run python tests/smoke_executa.py \
            "executas/mini-notes-summarizer/dist/stage/${{ matrix.platform }}/bin/${{ matrix.binary }}" \
            --expected-version "$EXECUTA_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: executas/mini-notes-summarizer/dist/assets/*
          if-no-files-found: error

  verify-release:
    needs: [verify-app, build-executa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify the complete release asset set
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          python tests/verify_release_assets.py \
            --assets-dir release-assets \
            --version "$version"

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
